name: host-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Maze simulation (real PistaA.cpp, 300 random mazes)
        run: |
          g++ -std=gnu++11 -O1 -Itests/stubs -Isrc -Iinclude tests/sim_pista_a.cpp src/PistaA.cpp src/Display.cpp -o sim_a
          ./sim_a 1900
      - name: Obstacle classifier
        run: g++ -std=gnu++11 -Itests/stubs -Isrc -Iinclude tests/test_obstacles.cpp -o t_obs && ./t_obs
      - name: Colour classifier
        run: g++ -std=gnu++11 -Itests/stubs -Isrc -Iinclude tests/test_colors.cpp src/Sensors.cpp -o t_col && ./t_col